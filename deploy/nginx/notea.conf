upstream notea {
    server 127.0.0.1:4300;
    keepalive 8;
}

server {
    server_name notea.co.tz;

    client_max_body_size 32m;

    access_log /var/log/nginx/notea-access.log;
    error_log  /var/log/nginx/notea-error.log;

    location /uploads/ {
        alias /var/www/notea/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://notea;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/notea.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notea.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.notea.co.tz;
    ssl_certificate /etc/letsencrypt/live/notea.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notea.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://notea.co.tz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notea.zanua.co.tz;
    ssl_certificate /etc/letsencrypt/live/notea.zanua.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notea.zanua.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://notea.co.tz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name notea.co.tz www.notea.co.tz notea.zanua.co.tz;
    return 301 https://notea.co.tz$request_uri;
}
