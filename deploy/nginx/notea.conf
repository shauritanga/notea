upstream notea {
    server 127.0.0.1:4300;
    keepalive 8;
}

server {
    server_name notea.zanua.co.tz;

    client_max_body_size 32m;

    access_log /var/log/nginx/notea-access.log;
    error_log  /var/log/nginx/notea-error.log;

    location /uploads/ {
        alias /var/www/notea/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://notea;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/notea.zanua.co.tz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/notea.zanua.co.tz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = notea.zanua.co.tz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name notea.zanua.co.tz;
    return 404; # managed by Certbot
}
